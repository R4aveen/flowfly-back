    scripts:
      afterResponse: >-
        const response = JSON.parse(insomnia.response.body);


        if (response.access_token) {
            insomnia.environment.set("token", response.access_token);
            console.log("✅ Token guardado: " + response.access_token.substring(0, 10) + "...");
        } else {
            console.error("❌ No se encontró access_token en la respuesta");
        }
