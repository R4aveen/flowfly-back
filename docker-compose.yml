version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: flowfly_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: flowfly_pass
      POSTGRES_DB: flowfly_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: